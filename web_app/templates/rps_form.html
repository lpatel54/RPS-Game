{% extends "layout.html" %}
{% set active_page = "rps" %}
{% block title %}Rock Paper Scissors | RPS &amp; Stocks{% endblock %}

{% block content %}
<section class="card app-panel">
    <div class="card-body p-4">
        <h1>Rock Paper Scissors</h1>
        <p>Choose your move to play against the computer.</p>
        <form method="post" action="{{ url_for('rps_routes.results') }}">
            <label class="form-label" for="user-choice">Your move</label>
            <select class="form-select mb-3" name="user_choice" id="user-choice" required>
                <option value="" selected disabled>Select a move</option>
                {% for choice in choices %}
                    <option value="{{ choice }}">{{ choice|capitalize }}</option>
                {% endfor %}
            </select>
            <button class="btn btn-primary" type="submit">Play</button>
        </form>
    </div>
</section>
{% endblock %}
